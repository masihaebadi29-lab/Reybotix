<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Meet Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo svg {
            width: 60px;
            height: 60px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .meeting-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group input::placeholder {
            color: #999;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
            color: #999;
            font-size: 14px;
        }

        .join-section {
            display: flex;
            gap: 10px;
        }

        .join-section input {
            flex: 1;
        }

        .join-section .btn {
            white-space: nowrap;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .feature {
            text-align: center;
        }

        .feature svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            fill: #667eea;
        }

        .feature p {
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .join-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#667eea"/>
            </svg>
        </div>
        <h1>جلسه ویدئویی</h1>
        <p class="subtitle">یک جلسه جدید ایجاد کنید یا با کد وارد شوید</p>

        <div class="meeting-form">
            <button class="btn btn-primary" onclick="createMeeting()">
                ایجاد جلسه جدید
            </button>

            <div class="divider">
                <span>یا</span>
            </div>

            <div class="join-section">
                <input type="text" id="meetingCode" placeholder="کد جلسه را وارد کنید" dir="ltr">
                <button class="btn btn-secondary" onclick="joinMeeting()">
                    پیوستن
                </button>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <p>کیفیت HD</p>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6v-2zm0 4h8v2H6v-2zm10 0h2v2h-2v-2zm-6-4h8v2h-8v-2z"/>
                </svg>
                <p>چت همزمان</p>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <p>ضبط جلسه</p>
            </div>
        </div>
    </div>

    <script>
        function generateMeetingCode() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let code = '';
            for (let i = 0; i < 10; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function createMeeting() {
            const code = generateMeetingCode();
            const url = `${window.location.origin}?meeting=${code}`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(code).then(() => {
                alert(`کد جلسه: ${code}\n\nلینک جلسه: ${url}\n\nکد در کلیپ‌بورد کپی شد.`);
            }).catch(() => {
                alert(`کد جلسه: ${code}\n\nلینک جلسه: ${url}`);
            });
        }

        function joinMeeting() {
            const code = document.getElementById('meetingCode').value.trim();
            if (!code) {
                alert('لطفاً کد جلسه را وارد کنید.');
                return;
            }
            if (code.length < 6) {
                alert('کد جلسه باید حداقل ۶ کاراکتر باشد.');
                return;
            }
            alert(`در حال پیوستن به جلسه با کد: ${code}`);
        }

        // Check URL for meeting code on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const meetingCode = urlParams.get('meeting');
            if (meetingCode) {
                document.getElementById('meetingCode').value = meetingCode;
                alert(`کد جلسه از لینک دریافت شد: ${meetingCode}`);
            }
        });
    </script>
</body>
</html>
